# Training configuration for the PPE detection model.
# Consumed by src/training/train.py.

# Starting checkpoint. yolo11s is the small model used here; swap to
# yolo11n for a faster/looser fit, or yolo11m/yolo11l for higher accuracy.
model: yolo11s.pt

# Dataset definition. See configs/data.yaml — the dataset is not in the repo.
data: configs/data.yaml

epochs: 100

imgsz: 640

# -1 lets Ultralytics estimate the batch size from available GPU memory.
batch: -1

# 2 is a safe value for Kaggle / free-tier GPUs.
workers: 2

optimizer: auto

lr0: 0.001

# Early stopping: stop if the metric does not improve for 20 epochs.
patience: 20

project: runs/train

name: ppe_yolo11s

cache: true

# Cosine learning rate schedule.
cos_lr: true

# Automatic mixed precision.
amp: true

plots: true

save: true

save_period: 10

seed: 42